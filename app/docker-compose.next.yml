services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discvault_next}
      POSTGRES_USER: ${POSTGRES_USER:-discvault_next}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discvault_next_dev}
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - ${DISCVAULT_NEXT_POSTGRES_DATA:-./.local/postgres-next}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-discvault_next} -d ${POSTGRES_DB:-discvault_next}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - discvault-next-net

  next-api:
    build:
      context: ./backend
      args:
        - BUILD_VERSION=${BUILD_VERSION:-next-dev}
        - BUILD_SHA=${BUILD_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discvault_next}:${POSTGRES_PASSWORD:-discvault_next_dev}@postgres:5432/${POSTGRES_DB:-discvault_next}
      TZ: ${TZ:-Europe/Amsterdam}
      BUILD_VERSION: ${BUILD_VERSION:-next-dev}
      BUILD_SHA: ${BUILD_SHA:-unknown}
      DISCVAULT_BACKEND_VERSION: ${BUILD_VERSION:-next-dev}
      DISCVAULT_BUILD_SHA: ${BUILD_SHA:-unknown}
      DISCVAULT_LEGACY_DATA_DIR: /data
      DISCVAULT_NEXT_ENABLE_TEST_RESET: ${DISCVAULT_NEXT_ENABLE_TEST_RESET:-false}
    volumes:
      - ${DISCVAULT_DATA_DIR:-./.local/data}:/data
    command: ["sh", "-c", "python next_database.py migrate && exec gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 180 next_app:app"]
    ports:
      - "${DISCVAULT_NEXT_API_PORT:-6180}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/next/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - discvault-next-net

  next-worker:
    build:
      context: ./backend
      args:
        - BUILD_VERSION=${BUILD_VERSION:-next-dev}
        - BUILD_SHA=${BUILD_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      next-api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discvault_next}:${POSTGRES_PASSWORD:-discvault_next_dev}@postgres:5432/${POSTGRES_DB:-discvault_next}
      TZ: ${TZ:-Europe/Amsterdam}
      DISCVAULT_WORKER_ID: ${DISCVAULT_WORKER_ID:-next-worker-1}
      DISCVAULT_WORKER_POLL_INTERVAL: ${DISCVAULT_WORKER_POLL_INTERVAL:-2}
      DISCVAULT_LEGACY_DATA_DIR: /data
    volumes:
      - ${DISCVAULT_DATA_DIR:-./.local/data}:/data
    command: ["python", "next_worker.py", "work"]
    networks:
      - discvault-next-net

  migrate:
    build:
      context: ./backend
      args:
        - BUILD_VERSION=${BUILD_VERSION:-next-dev}
        - BUILD_SHA=${BUILD_SHA:-unknown}
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discvault_next}:${POSTGRES_PASSWORD:-discvault_next_dev}@postgres:5432/${POSTGRES_DB:-discvault_next}
      TZ: ${TZ:-Europe/Amsterdam}
    command: ["python", "next_database.py", "migrate"]
    networks:
      - discvault-next-net

  migration-status:
    build:
      context: ./backend
      args:
        - BUILD_VERSION=${BUILD_VERSION:-next-dev}
        - BUILD_SHA=${BUILD_SHA:-unknown}
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discvault_next}:${POSTGRES_PASSWORD:-discvault_next_dev}@postgres:5432/${POSTGRES_DB:-discvault_next}
      TZ: ${TZ:-Europe/Amsterdam}
    command: ["python", "next_database.py", "status"]
    networks:
      - discvault-next-net

  import-sqlite:
    build:
      context: ./backend
      args:
        - BUILD_VERSION=${BUILD_VERSION:-next-dev}
        - BUILD_SHA=${BUILD_SHA:-unknown}
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discvault_next}:${POSTGRES_PASSWORD:-discvault_next_dev}@postgres:5432/${POSTGRES_DB:-discvault_next}
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - ${DISCVAULT_DATA_DIR:-./.local/data}:/data:ro
    command:
      [
        "python",
        "next_import.py",
        "--db",
        "/data/discvault.db",
        "--data-dir",
        "/data"
      ]
    networks:
      - discvault-next-net

networks:
  discvault-next-net:
    driver: bridge
