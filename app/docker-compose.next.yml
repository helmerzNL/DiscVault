services:
  postgres:
    image: postgres:17-alpine
    container_name: discvault-next-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discvault_next}
      POSTGRES_USER: ${POSTGRES_USER:-discvault_next}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discvault_next_dev}
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - ${DISCVAULT_NEXT_POSTGRES_DATA:-./.local/postgres-next}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-discvault_next} -d ${POSTGRES_DB:-discvault_next}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - discvault-next-net

  next-api:
    build:
      context: ./backend
      args:
        - BUILD_VERSION=${BUILD_VERSION:-next-dev}
        - BUILD_SHA=${BUILD_SHA:-unknown}
    container_name: discvault-next-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discvault_next}:${POSTGRES_PASSWORD:-discvault_next_dev}@postgres:5432/${POSTGRES_DB:-discvault_next}
      TZ: ${TZ:-Europe/Amsterdam}
      BUILD_VERSION: ${BUILD_VERSION:-next-dev}
      BUILD_SHA: ${BUILD_SHA:-unknown}
      DISCVAULT_BACKEND_VERSION: ${BUILD_VERSION:-next-dev}
      DISCVAULT_BUILD_SHA: ${BUILD_SHA:-unknown}
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--timeout", "180", "next_app:app"]
    ports:
      - "${DISCVAULT_NEXT_API_PORT:-6180}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/next/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - discvault-next-net

  next-worker:
    build:
      context: ./backend
      args:
        - BUILD_VERSION=${BUILD_VERSION:-next-dev}
        - BUILD_SHA=${BUILD_SHA:-unknown}
    container_name: discvault-next-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discvault_next}:${POSTGRES_PASSWORD:-discvault_next_dev}@postgres:5432/${POSTGRES_DB:-discvault_next}
      TZ: ${TZ:-Europe/Amsterdam}
      DISCVAULT_WORKER_ID: ${DISCVAULT_WORKER_ID:-next-worker-1}
      DISCVAULT_WORKER_POLL_INTERVAL: ${DISCVAULT_WORKER_POLL_INTERVAL:-2}
    command: ["python", "next_worker.py", "work"]
    networks:
      - discvault-next-net

  migrate:
    build:
      context: ./backend
      args:
        - BUILD_VERSION=${BUILD_VERSION:-next-dev}
        - BUILD_SHA=${BUILD_SHA:-unknown}
    container_name: discvault-next-migrate
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discvault_next}:${POSTGRES_PASSWORD:-discvault_next_dev}@postgres:5432/${POSTGRES_DB:-discvault_next}
      TZ: ${TZ:-Europe/Amsterdam}
    command: ["python", "next_database.py", "migrate"]
    networks:
      - discvault-next-net

  migration-status:
    build:
      context: ./backend
      args:
        - BUILD_VERSION=${BUILD_VERSION:-next-dev}
        - BUILD_SHA=${BUILD_SHA:-unknown}
    container_name: discvault-next-migration-status
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discvault_next}:${POSTGRES_PASSWORD:-discvault_next_dev}@postgres:5432/${POSTGRES_DB:-discvault_next}
      TZ: ${TZ:-Europe/Amsterdam}
    command: ["python", "next_database.py", "status"]
    networks:
      - discvault-next-net

  import-sqlite:
    build:
      context: ./backend
      args:
        - BUILD_VERSION=${BUILD_VERSION:-next-dev}
        - BUILD_SHA=${BUILD_SHA:-unknown}
    container_name: discvault-next-import-sqlite
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discvault_next}:${POSTGRES_PASSWORD:-discvault_next_dev}@postgres:5432/${POSTGRES_DB:-discvault_next}
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - ${DISCVAULT_SQLITE_IMPORT_DATA:-./.local/import-data}:/import:ro
    command:
      [
        "python",
        "next_import.py",
        "--db",
        "/import/discvault.db",
        "--data-dir",
        "/import"
      ]
    networks:
      - discvault-next-net

networks:
  discvault-next-net:
    driver: bridge
