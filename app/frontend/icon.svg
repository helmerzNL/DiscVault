<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="ig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="50%" stop-color="#e8c547"/>
      <stop offset="100%" stop-color="#c9a530"/>
    </linearGradient>
    <linearGradient id="dg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6af7"/>
      <stop offset="100%" stop-color="#5548c8"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14141e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="90" cy="86" r="62" fill="none" stroke="url(#ig)" stroke-width="1.5" opacity="0.3"/>

  <!-- Disc body -->
  <circle cx="90" cy="86" r="52" fill="#1a1a26" stroke="url(#dg)" stroke-width="2"/>

  <!-- Track rings -->
  <circle cx="90" cy="86" r="44" fill="none" stroke="#7c6af7" stroke-width="0.5" opacity="0.25"/>
  <circle cx="90" cy="86" r="36" fill="none" stroke="#7c6af7" stroke-width="0.5" opacity="0.2"/>
  <circle cx="90" cy="86" r="28" fill="none" stroke="#7c6af7" stroke-width="0.5" opacity="0.25"/>

  <!-- Refraction arcs -->
  <path d="M 55 58 A 52 52 0 0 1 112 50" fill="none" stroke="#e8c547" stroke-width="1" opacity="0.2"/>
  <path d="M 60 115 A 45 45 0 0 1 132 90" fill="none" stroke="#7c6af7" stroke-width="1" opacity="0.15"/>

  <!-- Hub -->
  <circle cx="90" cy="86" r="17" fill="#12121a" stroke="url(#ig)" stroke-width="1.5"/>
  <circle cx="90" cy="86" r="6" fill="none" stroke="url(#ig)" stroke-width="1" opacity="0.5"/>

  <!-- Vault keyhole -->
  <path d="M 90 80 L 95 84.5 L 93.5 91 L 86.5 91 L 85 84.5 Z" fill="url(#ig)"/>
  <rect x="88.5" y="89" width="3" height="5" rx="1" fill="url(#ig)"/>

  <!-- 4K badge -->
  <rect x="116" y="48" width="26" height="13" rx="6.5" fill="url(#ig)"/>
  <text x="129" y="58" text-anchor="middle" font-family="'SF Mono', 'DM Mono', monospace" font-size="7.5" font-weight="700" fill="#0a0a0f" letter-spacing="0.3">4K</text>

  <!-- Text -->
  <text x="90" y="158" text-anchor="middle" font-family="Georgia, 'DM Serif Display', serif" font-size="20" fill="url(#ig)" letter-spacing="-0.5">DiscVault</text>
</svg>
