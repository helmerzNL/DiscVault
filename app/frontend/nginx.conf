upstream backend {
    server backend:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api to the backend
    location /api/import {
        proxy_pass http://backend/api/import;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
    }

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;

        # Return clean JSON on backend errors instead of Nginx HTML
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"error":"Backend niet bereikbaar. Controleer of de backend container actief is."}';
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /service-worker.js =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
