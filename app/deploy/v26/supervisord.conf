[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:next-api]
directory=/opt/discvault/backend
command=/bin/sh -c "python next_database.py migrate && exec gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 180 next_app:app"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:mcp]
directory=/opt/discvault/mcp-server
command=/usr/local/bin/python server.py --http --host 0.0.0.0 --port 6090
environment=DISCVAULT_API="http://127.0.0.1:5000",DISCVAULT_MCP_VERSION="%(ENV_BUILD_VERSION)s"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
