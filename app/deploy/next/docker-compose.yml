services:
  postgres:
    image: postgres:17-alpine
    container_name: discvault-next-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discvault_next}
      POSTGRES_USER: ${POSTGRES_USER:-discvault_next}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-discvault_next} -d ${POSTGRES_DB:-discvault_next}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - discvault-next

  next-api:
    image: ${DISCVAULT_NEXT_IMAGE:-ghcr.io/helmerznl/discvault:dev}
    pull_policy: always
    container_name: discvault-next-api
    restart: unless-stopped
    working_dir: /opt/discvault/backend
    command:
      [
        "gunicorn",
        "--bind",
        "0.0.0.0:5000",
        "--workers",
        "${DISCVAULT_NEXT_API_WORKERS:-2}",
        "--timeout",
        "${DISCVAULT_NEXT_API_TIMEOUT:-180}",
        "next_app:app"
      ]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discvault_next}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-discvault_next}
      TZ: ${TZ:-Europe/Amsterdam}
      BUILD_VERSION: ${BUILD_VERSION:-next-dev}
      DISCVAULT_BACKEND_VERSION: ${BUILD_VERSION:-next-dev}
    ports:
      - "${DISCVAULT_NEXT_API_PORT:-6180}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/next/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - discvault-next

  next-worker:
    image: ${DISCVAULT_NEXT_IMAGE:-ghcr.io/helmerznl/discvault:dev}
    pull_policy: always
    container_name: discvault-next-worker
    restart: unless-stopped
    working_dir: /opt/discvault/backend
    command: ["python", "next_worker.py", "work"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discvault_next}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-discvault_next}
      TZ: ${TZ:-Europe/Amsterdam}
      DISCVAULT_WORKER_ID: ${DISCVAULT_WORKER_ID:-next-worker-1}
      DISCVAULT_WORKER_POLL_INTERVAL: ${DISCVAULT_WORKER_POLL_INTERVAL:-2}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - discvault-next

  migrate:
    image: ${DISCVAULT_NEXT_IMAGE:-ghcr.io/helmerznl/discvault:dev}
    pull_policy: always
    container_name: discvault-next-migrate
    profiles: ["tools"]
    working_dir: /opt/discvault/backend
    command: ["python", "next_database.py", "migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discvault_next}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-discvault_next}
      TZ: ${TZ:-Europe/Amsterdam}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - discvault-next

  migration-status:
    image: ${DISCVAULT_NEXT_IMAGE:-ghcr.io/helmerznl/discvault:dev}
    pull_policy: always
    container_name: discvault-next-migration-status
    profiles: ["tools"]
    working_dir: /opt/discvault/backend
    command: ["python", "next_database.py", "status"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discvault_next}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-discvault_next}
      TZ: ${TZ:-Europe/Amsterdam}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - discvault-next

  import-sqlite:
    image: ${DISCVAULT_NEXT_IMAGE:-ghcr.io/helmerznl/discvault:dev}
    pull_policy: always
    container_name: discvault-next-import-sqlite
    profiles: ["tools"]
    working_dir: /opt/discvault/backend
    command:
      [
        "python",
        "next_import.py",
        "--db",
        "/import/discvault.db",
        "--data-dir",
        "/import"
      ]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discvault_next}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-discvault_next}
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - ${DISCVAULT_SQLITE_IMPORT_DATA:-./import-data}:/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - discvault-next

volumes:
  postgres-data:

networks:
  discvault-next:
    name: discvault-next
