services:
  import-sqlite:
    image: ${DISCVAULT_NEXT_IMAGE}
    container_name: discvault-next-import-sqlite
    restart: "no"
    working_dir: /opt/discvault/backend
    command:
      [
        "python",
        "next_import.py",
        "--db",
        "/import/discvault.db",
        "--data-dir",
        "/import"
      ]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - ${DISCVAULT_SQLITE_IMPORT_DATA}:/import:ro
    networks:
      - discvault-next

networks:
  discvault-next:
    external: true
    name: discvault-next
