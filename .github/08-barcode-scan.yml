name: Barcode won't scan
description: A disc isn't recognised or returns the wrong result
title: "[Scan]: "
labels: ["bug", "scanner"]
body:
  - type: input
    id: ean
    attributes:
      label: Barcode / EAN
      description: Copy the number printed below the barcode.
      placeholder: "8717418512345"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Which disc is this?
      placeholder: "Dune Part Two — 4K UHD, Benelux edition"
    validations:
      required: true

  - type: dropdown
    id: problem
    attributes:
      label: What happens?
      options:
        - Camera doesn't detect the barcode
        - Barcode is read but no result is found
        - Wrong film or series is found
        - Right film, wrong edition or format
        - App crashes while scanning
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - PWA (browser)
        - Android
        - iOS
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and app version
      placeholder: "Pixel 9, Android 15, app 1.4.2"
    validations:
      required: true

  - type: input
    id: region
    attributes:
      label: Region or country of release
      placeholder: "Netherlands / Region B"

  - type: textarea
    id: extra
    attributes:
      label: Additional information
      description: A photo of the back of the case often helps identify the edition.
