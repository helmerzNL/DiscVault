name: PWA / Self-hosting
description: Problem with the web app or with a self-hosted installation
title: "[PWA]: "
labels: ["bug", "platform:pwa", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for problems with the web app, installing it as a PWA, or
        running your own (self-hosted) DiscVault server.

  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: hosting
    attributes:
      label: How are you running DiscVault?
      options:
        - Hosted version (discvault.app)
        - Self-hosted via Docker
        - Self-hosted via Docker Compose
        - Self-hosted, manual installation
        - Local development environment
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App / server version or image tag
      placeholder: "1.4.2 or ghcr.io/.../discvault:1.4.2"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: How are you using the app?
      options:
        - In a browser tab
        - Installed as a PWA (desktop)
        - Installed as a PWA (mobile)
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 140 / Safari 18.5 / Firefox 141"
    validations:
      required: true

  - type: dropdown
    id: infra
    attributes:
      label: Relevant infrastructure (self-hosting only)
      multiple: true
      options:
        - Reverse proxy (Nginx / Traefik / Caddy)
        - Cloudflare or another CDN
        - Custom TLS certificate
        - Non-standard port or subpath
        - Database in a separate container
        - None of the above / not self-hosted

  - type: textarea
    id: console
    attributes:
      label: Browser console and network errors
      description: Open DevTools → Console and Network, then paste any relevant errors.
      render: shell

  - type: textarea
    id: serverlogs
    attributes:
      label: Server logs (self-hosting only)
      description: For example `docker logs discvault --tail 100`. Please redact secrets and tokens.
      render: shell

  - type: checkboxes
    id: tried
    attributes:
      label: Already tried
      options:
        - label: Hard refresh and cleared the cache
        - label: Tested in a private window or a different browser
        - label: Unregistered / reinstalled the service worker
        - label: I searched for existing reports of this problem
          required: true
