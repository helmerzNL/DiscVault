name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you run into, rather than jumping straight to a solution.
      placeholder: I can't see which discs I own twice, so I sometimes buy the same film again.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think this should work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other ways to solve this? How do you work around it today?

  - type: dropdown
    id: platform
    attributes:
      label: Which platform is this for?
      multiple: true
      options:
        - PWA (browser)
        - Android
        - iOS
        - All platforms
    validations:
      required: true

  - type: dropdown
    id: importance
    attributes:
      label: How important is this to you?
      options:
        - Nice to have some day
        - Would clearly improve my use of the app
        - I run into this daily
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Sketches, screenshots from other apps, links — anything that helps.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I searched for existing requests for this feature
          required: true
