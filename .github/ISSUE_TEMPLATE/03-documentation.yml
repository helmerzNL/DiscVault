name: Documentation
description: Something in the documentation is wrong or missing
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Where is it?
      description: Link to the page or file.
      placeholder: "https://... or docs/installation.md"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What's the problem?
      options:
        - Information is incorrect
        - Information is missing
        - Unclear or confusing
        - Out of date
        - Typo or grammar
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong, and what should it say instead?
    validations:
      required: true
