name: iOS app
description: Problem with the DiscVault app on iPhone or iPad
title: "[iOS]: "
labels: ["bug", "platform:ios", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: appversion
    attributes:
      label: App version and build number
      description: Found under Settings → About.
      placeholder: "1.4.2 (218)"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: How did you install the app?
      options:
        - App Store
        - TestFlight
        - Built myself in Xcode
    validations:
      required: true

  - type: input
    id: iosversion
    attributes:
      label: iOS version
      placeholder: "iOS 18.5"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Device
      placeholder: "iPhone 15 Pro / iPad Air M2"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Type of problem
      options:
        - App crashes
        - App freezes or stops responding
        - Incorrect display or layout
        - Feature doesn't work as expected
        - Sync or sign-in fails
        - Camera / barcode scanning
        - Notifications
    validations:
      required: true

  - type: textarea
    id: crashlog
    attributes:
      label: Crash log
      description: Settings → Privacy & Security → Analytics & Improvements → Analytics Data. Look for "DiscVault".
      render: shell

  - type: checkboxes
    id: tried
    attributes:
      label: Already tried
      options:
        - label: Force-quit the app and reopened it
        - label: Reinstalled the app
        - label: Tested on the latest app version
        - label: I searched for existing reports of this problem
          required: true
