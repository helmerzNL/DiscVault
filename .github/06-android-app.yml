name: Android app
description: Problem with the DiscVault app on Android
title: "[Android]: "
labels: ["bug", "platform:android", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: appversion
    attributes:
      label: App version and build number
      description: Found under Settings → About.
      placeholder: "1.4.2 (218)"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: How did you install the app?
      options:
        - Google Play Store
        - Play Store beta programme
        - APK sideloaded
        - F-Droid
        - Built myself
    validations:
      required: true

  - type: input
    id: androidversion
    attributes:
      label: Android version
      placeholder: "Android 15 (API 35)"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Device and manufacturer
      placeholder: "Google Pixel 9 / Samsung Galaxy S24 (One UI 7)"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Type of problem
      options:
        - App crashes
        - App freezes or stops responding
        - Incorrect display or layout
        - Feature doesn't work as expected
        - Sync or sign-in fails
        - Camera / barcode scanning
        - Notifications
        - Battery drain or background behaviour
    validations:
      required: true

  - type: textarea
    id: logcat
    attributes:
      label: Logcat or stack trace
      description: For example via `adb logcat *:E`, or the crash report from Play Console. Please redact personal data.
      render: shell

  - type: checkboxes
    id: tried
    attributes:
      label: Already tried
      options:
        - label: Force-stopped the app and reopened it
        - label: Cleared the app cache
        - label: Reinstalled the app
        - label: Disabled battery optimisation for the app
        - label: I searched for existing reports of this problem
          required: true
