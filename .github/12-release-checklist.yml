name: Release checklist
description: Standard checklist for shipping a new version
title: "Release x.y.z"
labels: ["release"]
body:
  - type: input
    id: version
    attributes:
      label: Version number
      placeholder: "1.5.0"
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Planned release date
      placeholder: "2026-09-15"

  - type: textarea
    id: highlights
    attributes:
      label: Main changes
      description: Short list for the release notes.
    validations:
      required: true

  - type: checkboxes
    id: preparation
    attributes:
      label: Preparation
      options:
        - label: All planned issues closed or moved to the next milestone
        - label: Version number bumped on all platforms
        - label: Changelog updated
        - label: Database migrations tested, including rollback
        - label: Translations complete

  - type: checkboxes
    id: testing
    attributes:
      label: Testing
      options:
        - label: CI green on the release branch
        - label: PWA tested in Chrome, Safari and Firefox
        - label: Android tested on a physical device
        - label: iOS tested on a physical device
        - label: Upgrade from the previous version tested
        - label: Offline behaviour and sync tested

  - type: checkboxes
    id: rollout
    attributes:
      label: Rollout
      options:
        - label: Tag and GitHub release created
        - label: Docker image published
        - label: PWA deployed to production
        - label: Android build submitted to Play Store
        - label: iOS build submitted to App Store
        - label: Store screenshots and descriptions updated

  - type: checkboxes
    id: after
    attributes:
      label: After release
      options:
        - label: Release notes published and shared
        - label: Error reports and crash logs monitored
        - label: Documentation updated
