name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
      - release/v26-beta
    tags:
      - "v26.*.*"
    paths:
      - "app/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:       # allow manual trigger from GitHub UI

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: helmerznl/discvault

jobs:
  # The image carries app/VERSION as BUILD_VERSION, so publishing an unguarded build ships a
  # version number that may already belong to a different image. That happened on beta when
  # two PRs bumped to the same value: the standalone version-guard workflow went red while
  # this one published anyway, because nothing connected the two. Gate the build on the same
  # check so a rejected version cannot reach the registry.
  version-guard:
    # Not on a beta push: there the bump is applied by version-bump below, so asking
    # "did this push already bump?" would fail every merge by construction.
    # Not on a replayed bump commit either -- see `replaying a bump` below.
    # Double-quoted because the expression contains "chore: bump app/VERSION": a colon
    # followed by a space makes an unquoted YAML scalar parse as a nested mapping, and
    # GitHub then reports the whole file as unloadable rather than failing a job.
    if: "(github.ref != 'refs/heads/release/v26-beta' || github.event_name != 'push') && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: bump app/VERSION'))"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The guard compares HEAD against the commit the push started from, which a shallow
          # checkout does not contain.
          fetch-depth: 0

      - name: Check app version bump
        run: |
          # A manual dispatch and a tag push have no meaningful "before" commit; the script
          # detects that via valid_commit() and falls back to inspecting HEAD alone, which
          # keeps the :dev escape hatch usable.
          python app/scripts/check_version_bumped.py \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}" \
            --aggregate

  # The bump lives here rather than in the merged pull requests. A bump written by hand
  # is only valid against the base as it stood when it was written, and GitHub does not
  # re-run the guard when the base moves -- so three PRs merging within 26 seconds all
  # bumped to 26.8.39, two guards went red on beta, and the image was never built (#573).
  # Applied after the merge instead, the bump is derived from the branch it lands on and
  # cannot go stale.
  #
  # This has to run *before* the build in the same run, not as a push that retriggers the
  # workflow: a push made with GITHUB_TOKEN deliberately does not start a new workflow
  # run. That property is what stops this from looping.
  #
  # `replaying a bump`: the remaining case is a human replaying the bump commit, which the
  # message used to cover with `[skip ci]`. That marker had to go. GitHub honours it for
  # `pull_request` as well as `push`, and beta's tip is *always* a bump commit -- so every
  # promotion PR opened from beta had all of its checks skipped, and a required check that
  # never reports blocks the merge exactly like a red one (#621). The replay case is now
  # handled where it belongs: an explicit condition on the jobs of this workflow, which
  # cannot leak into the checks of an unrelated pull request.
  version-bump:
    if: "github.event_name == 'push' && github.ref == 'refs/heads/release/v26-beta' && !startsWith(github.event.head_commit.message, 'chore: bump app/VERSION')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two merges seconds apart give two runs. Serialising them here is what turns the
    # race between two humans into no race at all, rather than relocating it into CI.
    concurrency:
      group: beta-version-bump
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: release/v26-beta
          fetch-depth: 0

      - name: Bump app/VERSION on beta
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `Block force pushes` is on for every branch in this repository, so a failed
          # push may only be retried by starting again from the new tip -- never forced.
          # Restarting from the tip is also simpler than rebasing: the only change is one
          # line in one file, so recomputing it against the new base cannot conflict.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet --no-tags origin release/v26-beta
            git checkout --quiet -B release/v26-beta origin/release/v26-beta

            python app/scripts/bump_version.py --force --no-stage --base-ref ""
            version="$(tr -d '[:space:]' < app/VERSION)"

            git add app/VERSION
            git commit --quiet -m "chore: bump app/VERSION to ${version}"

            if git push origin release/v26-beta; then
              echo "version=${version}" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "Bumped app/VERSION to ${version} on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}); beta moved. Retrying from its new tip." >&2
            sleep $((attempt * 4))
          done

          echo "Could not push the version bump to release/v26-beta after 5 attempts." >&2
          exit 1

  build-and-push:
    needs: [version-guard, version-bump]
    # Exactly one of the two jobs above runs on any given event, so the default
    # all-must-succeed rule would skip the build every time. Require instead that
    # neither *failed*.
    # The bump-commit clause repeats here on purpose: both jobs above *skip* on a replayed
    # bump commit, and a skipped need is not a failed one, so without it the build would
    # publish the replay anyway.
    if: "${{ !cancelled() && needs.version-guard.result != 'failure' && needs.version-bump.result != 'failure' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: bump app/VERSION')) }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # On beta this is the bump commit, so the image carries the version the branch
          # now advertises. Building `github.sha` instead would tag every beta image with
          # the version of the merge *before* the bump -- the previous image's number.
          ref: ${{ needs.version-bump.outputs.sha || github.sha }}

      # Extract version from tag (v26.0.0 -> 26.0.0), app/VERSION, or a channel SHA fallback.
      - name: Derive build version
        id: version
        run: |
          SHA="$(git rev-parse HEAD)"
          APP_VERSION="$(tr -d '[:space:]' < app/VERSION)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${APP_VERSION}" ]]; then
            VERSION="${APP_VERSION}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            VERSION="beta-${SHA:0:7}"
          else
            VERSION="dev-${SHA:0:7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"
          echo "Build SHA: ${SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # BuildKit itself comes from Google's Docker Hub pull-through cache rather than
          # from Docker Hub directly, which is what timed out and broke this job. It cannot
          # come from GHCR: `ghcr.io/moby/buildkit` does not publish `buildx-stable-1`, so
          # pointing there fails deterministically with "denied".
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # And every `FROM` inside the build resolves through the same cache. The image is
          # pulled by the daemon before buildkitd exists, so driver-opts above cannot cover
          # it; this covers app/Dockerfile.v26's `FROM python:3.12-slim` and anything added
          # later, without rewriting image references in the Dockerfile.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Dockerfile
        id: build-target
        shell: bash
        run: |
          set -euo pipefail
          # The legacy app/Dockerfile was removed in "Remove legacy DiscVault app
          # from the v26 line"; the v26 stack (app/Dockerfile.v26) is now the only
          # build, on every branch including main. The frozen :legacy image is the
          # old DiscVault app and is no longer rebuilt here (kept until cleanup).
          dockerfile="./app/Dockerfile.v26"
          family="v26-stack"
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
          echo "family=$family" >> "$GITHUB_OUTPUT"
          echo "Using Dockerfile: $dockerfile ($family)"

      # Resolve tags:
      #   main                -> :latest, :v26, :stable   (production image)
      #   release/v26-beta    -> :v26-beta, :beta         (development image)
      #   tag v26.x.x         -> :v26.x.x, :v26, :stable  (release snapshot of main)
      #   manual run          -> :dev, :dev-<sha>         (throwaway escape hatch)
      #
      # The release-snapshot row is keyed off the *ref*, never the event. release.yml
      # cannot reach this workflow by pushing a tag -- a push made with GITHUB_TOKEN
      # starts no workflow run -- so it dispatches this workflow on the tag instead, and
      # a dispatch on a tag ref has to mean "release snapshot", not "throwaway :dev".
      # That is also why the two spellings of the version are raw entries rather than
      # `type=semver` + `type=ref,event=tag`: those are gated on the event being a tag
      # push, which the dispatch is not, and the images would silently lose their
      # version-pinned tags.
      # (:legacy is intentionally not produced here — it stays the frozen old
      #  DiscVault image until we retire it.)
      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v26.') }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v26.') }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' && github.ref_type != 'tag' }}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_type != 'tag' }}
            type=raw,value=v26-beta,enable=${{ github.ref == 'refs/heads/release/v26-beta' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/release/v26-beta' }}
            type=raw,value=v26,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=v26,enable=${{ github.ref_type == 'tag' }}
          labels: |
            # The action derives `revision` from the push event, which on beta is
            # the merge commit -- one behind the bump commit the image is actually
            # built from. Set explicitly so the label names the tree that was
            # built rather than its parent.
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
            org.opencontainers.image.title=DiscVault
            org.opencontainers.image.description=Physical 4K/Blu-ray/DVD collection manager with barcode scanner, web UI and MCP endpoint.
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            eu.discvault.image.family=${{ steps.build-target.outputs.family }}

      - name: Build and push
        id: build-and-push
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ${{ steps.build-target.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_SHA=${{ steps.version.outputs.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR can briefly reject uploads with a secondary-rate-limit 403. Wait before
      # one complete rebuild so the registry has time to clear the limit.
      - name: Wait before retrying image publish
        if: steps.build-and-push.outcome == 'failure'
        run: sleep 120

      - name: Retry build and push
        if: steps.build-and-push.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ${{ steps.build-target.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
           BUILD_VERSION=${{ steps.version.outputs.version }}
           BUILD_SHA=${{ steps.version.outputs.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Published ${{ steps.meta.outputs.tags }}"
