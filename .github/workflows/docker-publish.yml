name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
      - release/v26-dev
      - release/v26-beta
      - release/v26
    tags:
      - "v26.*.*"
    paths:
      - "app/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:       # allow manual trigger from GitHub UI

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: helmerznl/discvault

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Extract version from tag (v26.0.0 -> 26.0.0), app/VERSION, or a channel SHA fallback.
      - name: Derive build version
        id: version
        run: |
          SHA="$(git rev-parse HEAD)"
          APP_VERSION="$(tr -d '[:space:]' < app/VERSION)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${APP_VERSION}" ]]; then
            VERSION="${APP_VERSION}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            VERSION="beta-${SHA:0:7}"
          else
            VERSION="dev-${SHA:0:7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"
          echo "Build SHA: ${SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Dockerfile
        id: build-target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            dockerfile="./app/Dockerfile"
            family="legacy"
          else
            dockerfile="./app/Dockerfile.v26"
            family="v26-stack"
          fi
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
          echo "family=$family" >> "$GITHUB_OUTPUT"
          echo "Using Dockerfile: $dockerfile ($family)"

      # Resolve tags:
      #   main                -> :latest, :legacy
      #   release/v26-dev     -> :dev, :v26-dev
      #   release/v26-beta    -> :v26-beta
      #   release/v26         -> :v26
      #   tag v26.0.0         -> :v26.0.0, :v26
      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=legacy,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/release/v26-dev' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=v26-dev,enable=${{ github.ref == 'refs/heads/release/v26-dev' }}
            type=raw,value=v26-beta,enable=${{ github.ref == 'refs/heads/release/v26-beta' }}
            type=raw,value=v26,enable=${{ github.ref == 'refs/heads/release/v26' }}
            type=raw,value=v26,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/v26.') }}
          labels: |
            org.opencontainers.image.title=DiscVault
            org.opencontainers.image.description=Physical 4K/Blu-ray/DVD collection manager with barcode scanner, web UI and MCP endpoint.
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            eu.discvault.image.family=${{ steps.build-target.outputs.family }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ${{ steps.build-target.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_SHA=${{ steps.version.outputs.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Published ${{ steps.meta.outputs.tags }}"
