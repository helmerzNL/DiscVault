name: DiscVault Next PostgreSQL Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - release/v26-beta
  push:
    branches:
      - main
      - release/v26-beta
    paths:
      # One pattern rather than a file list. The enumerated version missed 31
      # of 43 backend modules -- including next_views_ui.py, which is the whole
      # PWA -- so a change could land on beta without the smoke ever running.
      # An allowlist of files silently stops covering every module added after
      # it was written, and nothing fails to tell you.
      - "app/backend/**"
      # The two frontend modules are read directly by tests in this job
      # (tests.test_next_library_paging asserts on library-paging.js and
      # library-export.js as source), so a change to them can break this job
      # without touching app/backend at all.
      - "app/frontend/js/**"
      - ".github/workflows/next-postgres-smoke.yml"
      - "sync/fixtures/identity-ladder.json"

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: discvault_next
          POSTGRES_USER: discvault_next
          POSTGRES_PASSWORD: discvault_next_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U discvault_next -d discvault_next"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://discvault_next:discvault_next_dev@localhost:5432/discvault_next

      JWT_SECRET: discvault-ci-only-not-a-production-secret

    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend requirements
        run: python -m pip install -r requirements.txt

      - name: Compile Next tooling
        run: python -m py_compile dedup_identity.py identity_fixture_contract.py next_metadata.py scripts/sync_dedup_merge.py scripts/validate_identity_ladder_fixture.py next_database.py next_import.py next_app.py next_auth.py next_crawlers.py next_legacy_auth.py next_runtime_secrets.py next_settings_store.py next_plugin_runtime.py next_movievault_v2.py next_movievault_v2_contributions.py next_artwork_trash.py next_worker.py

      # `py_compile` above proves these modules parse; it cannot prove a line
      # can run. Every bulk "add to box-set" returned `name 'actor' is not
      # defined` from a line that compiled cleanly (#720), and the same file
      # called `json.dumps` while importing the module as `json_lib`. Both are
      # decidable statically, so they are refused here rather than in the field.
      - name: Check every backend module for names that cannot resolve
        run: python scripts/check_undefined_names.py .

      # The gate's own tests, both directions. A checker with no test is the
      # thing it exists to prevent: it reports nothing, and nothing reads the
      # same as clean. Its first version built "defined" from every symbol a
      # module mentions, so a module-level read of an undefined name vouched
      # for the function-level read of the same name and the finding was
      # suppressed. The false-positive half matters just as much -- a gate
      # that refuses working modules gets switched off.
      - name: Test the unresolvable-name gate itself
        run: python -m unittest tests.test_check_undefined_names

      - name: Validate pinned identity-ladder fixture coverage
        run: python scripts/validate_identity_ladder_fixture.py

      - name: Test identity fixture and identifier extraction
        run: python -m unittest tests.test_identity_ladder_fixture tests.test_identity_ladder_validator tests.test_identity_identifier_extraction

      # Both halves of the same fail-closed rule. `next_runtime_secrets` refuses
      # to invent a secret; `next_settings_store` refuses to store a credential
      # it could not encrypt. The second used to return the plaintext instead,
      # which is invisible from every direction - the row looks ordinary and an
      # unmarked value is read back as legacy plaintext without complaint.
      - name: Test runtime secret configuration
        run: >-
          python -m unittest
          tests.test_next_runtime_secrets
          tests.test_next_settings_store

      # Listed by hand like every module above it. The throttles these cover sit
      # on endpoints that had none, so a silent drop here restores the gap
      # without anything failing to say so.
      - name: Test authentication throttling
        run: >-
          python -m unittest
          tests.test_next_auth_throttle
          tests.test_next_legacy_auth
          tests.test_next_mobile_auth
          tests.test_next_review_login
          tests.test_next_effective_permission_keys

      # The passkey ceremony itself. On a passkey-only instance this is the
      # entire front door, and both defects it covers were invisible in normal
      # single-user testing: the challenge race needs two people at once, and
      # the counter check needs an authenticator that actually counts.
      - name: Test the passkey login ceremony
        run: python -m unittest tests.test_next_passkey_ceremony

      # Reads the routing table out of the source and checks that the token the
      # server hands its own native clients can actually pass every gate the
      # advertised contract sends them through. Tightening a route's permission
      # without widening the tuple is meant to fail here -- today it would fail
      # silently in the field instead, and only once token scopes are binding.
      - name: Test token scope sufficiency
        run: >-
          python -m unittest
          tests.test_next_token_scope_sufficiency
          tests.test_next_api_token
          tests.test_next_api_tokens

      # The MCP server offers one list of tools; the backend catalogue decides
      # which of them a call may use, and every call is checked against it.
      # Nothing forces the two together, so #654 shipped five statistics tools
      # that `tools/list` advertised and every call refused, for every role,
      # with no permission that could grant them. Source-level agreement is the
      # only place this is checkable: both sides are internally consistent.
      - name: Test that the MCP tool catalogue agrees with the MCP server
        run: python -m unittest tests.test_next_mcp_tool_catalog

      # /mcp on the API port is a proxy, and its target was hardcoded to
      # loopback: right for the all-in-one image, and the API's own loopback in
      # every split deployment, where it refused every call however healthy the
      # MCP server was. Nothing failed in CI because both halves were fine on
      # their own -- only the compose file that wires them was wrong.
      - name: Test where the MCP proxy forwards to
        run: python -m unittest tests.test_next_mcp_proxy_target

      # A token's scope is only a limit if both halves have to agree, and only
      # honestly a limit if the gates that consult no permission at all -- role
      # management, user deletion, the auth toggle, ownership transfer -- refuse
      # a token too. Losing either half silently restores an "advisory" scope,
      # which looks identical from the outside to an enforced one.
      - name: Test that token scopes bind
        run: >-
          python -m unittest
          tests.test_next_token_binding
          tests.test_next_plugin_authorization

      # Opening a film queues its refresh instead of waiting for it. The whole
      # claim is that the *work* is unchanged and only its location moved, so
      # these assertions are about what must not quietly disappear: the job
      # still asks for people, the worker still runs the same cascade, and a
      # job still running when the page stops polling is not reported as done.
      # A version that refreshed less would feel faster still and be a
      # regression rather than a fix.
      - name: Test the queued movie-detail refresh
        run: python -m unittest tests.test_next_movie_detail_lazy_refresh

      # Three memos that each remove work a request was doing twice, and whose
      # every risk is a *stale* answer rather than a slow one. The tests that
      # matter here are the negative ones: a connection's memo must not outlive
      # the connection, a request's must not outlive the request, and a failed
      # sign-in must never be remembered as "nobody is here". Losing those
      # assertions leaves something that still looks fast and starts answering
      # yesterday's question.
      - name: Test the request-scoped authentication memos
        run: python -m unittest tests.test_next_request_scoped_auth

      # One parser, and nothing parses its own. The value here is the invariant
      # rather than the nine unit cases: nineteen routes each had their own
      # `int(request.args.get(...))`, three different behaviours between them,
      # and a new route written the old way reintroduces a 500 on a typo without
      # anything failing to say so.
      - name: Test query-argument parsing
        run: python -m unittest tests.test_next_query_argument_parsing

      # The Discover feed, and above all its paging. This workflow lists rather
      # than discovers, and this module had never been listed -- so the route
      # that served every page of Discover as page 1, repeating the same twenty
      # films forever (#736), had tests beside it that no job ever ran. A test
      # no job names does not exist.
      - name: Test the Discover feed and its paging
        run: python -m unittest tests.test_next_discover

      # Reading the plugin list must not make the reader a writer. Losing the
      # memo would silently restore the coupling that let one slow provider call
      # freeze every page load -- and nothing about that failure is visible in a
      # test that only checks the registry ends up correct.
      - name: Test the plugin registry cache
        run: >-
          python -m unittest
          tests.test_next_plugin_registry_cache
          tests.test_next_plugin_runtime
          tests.test_next_plugin_runtime_module_reuse

      # A cache is two properties that pull against each other: it has to be
      # used, and it must never be the reason a lookup fails or replays a side
      # effect. Most of that module is about what is deliberately not cached --
      # pushes, imports, syncs, health checks -- and losing those assertions
      # would not fail anything until something was replayed for real.
      - name: Test the metadata lookup cache
        run: python -m unittest tests.test_next_metadata_lookup_cache

      - name: Test MovieVault v2 contract and privacy policy
        run: python -m unittest tests.test_next_movievault_v2

      - name: Test MovieVault v2 release contributions
        run: python -m unittest tests.test_next_movievault_v2_contributions

      # The couple-and-merge merge-target route: what the identity endpoint
      # exposes (I_srv only), what it withholds (token/key/key id, and the id
      # itself when unregistered), and that it fails closed on the permission
      # gate. Listed explicitly because this workflow lists rather than
      # discovers, and the route test lives in its own file.
      - name: Test couple-and-merge identity route
        run: python -m unittest tests.test_next_movievault_contribution_identity_route

      # The iOS release-selection front door, and mostly what it refuses: a
      # selection when the gate is off, for a film the sync has not landed here
      # yet, or with nothing of substance to say. The 404 is the one that has to
      # keep working -- iOS reads it as "retry after the next ack", and a route
      # that answered anything else would tell a client to give up on a film
      # that simply had not arrived. Its own file, so this workflow -- which
      # lists rather than discovers -- had never been given it, and the module
      # sat red on beta with nothing reporting it.
      - name: Test the iOS release-selection route
        run: python -m unittest tests.test_next_movievault_release_selection_route

      # The conversions a field correction makes on the way out - two packaging
      # axes flattened to one list, free-text ratios filtered to the bounded
      # form, and the audio/subtitle union refused rather than half-sent. Pure
      # functions, so they run here rather than after the migrations.
      - name: Test the field-correction technical conversions
        run: python -m unittest tests.test_next_movievault_field_correction_technical

      # Another module the hand-written list had simply never been given, in the
      # same class as the three below. It holds the plugin's own mapping tests -
      # what a release proposes, and which series a television disc belongs to -
      # so without it those assertions ran only on a contributor's machine.
      - name: Test the MovieVault v2 plugin mapping
        run: python -m unittest tests.test_next_movievault_v2_plugin

      # The per-contract parsing guards, never listed here either. Their cost is
      # not hypothetical: the v3 module asserts that an unsupported contract is
      # refused, and when distribution-5 shipped that assertion silently stopped
      # refusing anything and started reaching the network - for weeks, because
      # nothing invoked the file. A guard nobody runs is not a guard.
      - name: Test the MovieVault distribution contract parsers
        run: >-
          python -m unittest
          tests.test_next_movievault_distribution_v3
          tests.test_next_movievault_distribution_v4
          tests.test_next_movievault_distribution_v6

      # The barcode resolver's own contract guards - and the clearest case yet of
      # the same gap. `test_next_release_details_subtitles.py` was written after
      # an additive MovieVault field took barcode scanning down, and says in its
      # own docstring that it "exists so that acceptance is provably in place
      # before the producer changes". It was never named here, so it never ran,
      # and five days later `finishes` broke the identical path.
      - name: Test the release-details resolver contract
        run: >-
          python -m unittest
          tests.test_next_release_details_search
          tests.test_next_release_details_subtitles
          tests.test_next_release_details_finishes
          tests.test_next_release_fallback_ui

      # Translations are part of "done" in this repository, and this suite is
      # what makes that checkable: it holds all 29 locales to the exact key set
      # of the en-US source. Also never listed, so a PR could add a key to one
      # file and leave twenty-eight showing the English fallback.
      - name: Test the i18n catalog completeness
        run: >-
          python -m unittest
          tests.test_next_i18n
          tests.test_next_i18n_completeness

      # The allowlist that decides whether a declared capability can run at all.
      # It disagreed with both bundled manifests for the whole life of the series
      # feature -- six capabilities implemented, declared, and unreachable -- and
      # no test could have caught it, because every series test replaces either
      # the plugin function or run_plugin_entrypoint itself. Runs early: if these
      # two fail, every series assertion below is testing something the
      # application cannot reach.
      - name: Test that declared capabilities are runnable
        run: python -m unittest tests.test_next_plugin_entrypoint_coverage

      # Which release-level fields stop being authored once a release has
      # discs, held across all three copies of that answer: the server's set,
      # the browser's constant, and the fields actually tagged in the markup.
      # No database -- it reads source text -- so it runs up here.
      - name: Test the derived release-field parity
        run: python -m unittest tests.test_next_derived_release_fields

      # The TMDB series shaping needs no database, so it runs before the
      # migrations with the other pure-Python modules.
      - name: Test the TMDB series mapping
        run: python -m unittest tests.test_next_tmdb_series

      # TheTVDB, same reason and one more: its API is unreachable from the
      # environment the plugin was written in, so the URLs and field names came
      # from TheTVDB's own OpenAPI document rather than from a live call. These
      # assertions are what keep that reading and the code from drifting apart --
      # the season-ordering one especially, since a show with a DVD order returns
      # season 1 twice and nothing else would notice.
      - name: Test the TheTVDB series mapping
        run: python -m unittest tests.test_next_tvdb_series

      # Attribution is a licence obligation: the wording belongs to the source
      # and is rendered as the source's manifest states it. These tests are the
      # guard against that being "improved" into composed or translated copy,
      # which would break a licence while every screen still looked fine.
      - name: Test per-source attribution
        run: python -m unittest tests.test_next_source_attribution

      # Where the version bump happens. Nothing else in this repository fails when
      # the bump job stops running: the next image simply keeps carrying the
      # previous version number, which looks exactly like a build that was not
      # needed. Only these assertions tell the difference.
      - name: Test the version bump pipeline
        run: python -m unittest tests.test_version_bump_pipeline

      # How several sources' artwork becomes one answer. Text is forgiving -- a
      # missing overview leaves a blank somebody notices. A poster that quietly
      # did not arrive looks exactly like a series whose source has none, because
      # the borrowed disc artwork underneath hides the difference.
      - name: Test series artwork merging
        run: python -m unittest tests.test_next_series_artwork

      # Two self-hosted instances were findable in Google without anything being
      # misconfigured, and every layer that now prevents it can regress silently:
      # a robots.txt that stops disallowing, a noindex header that stops being
      # applied, or a user-agent refusal that starts matching the health check and
      # reports a live instance as down. No database -- it asserts on strings and
      # a user agent -- so it runs up here.
      - name: Test crawler and AI-scraper exclusion
        run: python -m unittest tests.test_next_crawlers

      # Plugins run from a writable install directory that is seeded once, not
      # from the image, so "removed from the bundle" only became an uninstall
      # when the upgrade pass started removing the files too. Every test starts
      # without an install directory, which is precisely why this needs its own
      # module: it builds the upgraded-deployment case by hand -- seed, then
      # take the plugin out of the bundle. No database; it works on temporary
      # directories.
      - name: Test that a dropped bundled plugin is uninstalled
        run: python -m unittest tests.test_next_plugin_removal_on_upgrade

      # The repository's own guard scripts had no coverage running anywhere.
      # They are the enforcement points every MUST rule in the baseline leans
      # on, so a guard that silently stopped guarding would look exactly like a
      # branch with nothing wrong. Run from the repository root because the
      # scripts resolve paths relative to it.
      #
      # Listed rather than discovered, because `test_sync_dedup_merge` is
      # deliberately NOT in this list: four of its cases have been failing since
      # #395 on 2026-07-24, unnoticed because nothing ran them. They expect the
      # title/year dedup group key to carry the media format -- `("what women
      # want", "", "dvd")` -- and `sync_dedup_merge.py` still produces the
      # two-part key. That is the physical-copy identity #395 set out to
      # preserve, so it needs deciding on its own terms rather than being
      # silently switched off or hurried into an unrelated pull request.
      - name: Test the guard scripts
        working-directory: .
        run: >-
          python -m unittest
          app.scripts.tests.test_bump_version
          app.scripts.tests.test_check_forbidden_paths
          app.scripts.tests.test_check_version_bumped
          app.scripts.tests.test_check_plugin_manifest_versions
          app.scripts.tests.test_prune_landed_branches

      # What the backup screen costs, and what it is allowed to report. The
      # summary cache is the reason listing the archives is cheap; the older
      # module beside it is the regression net for the validation the cache now
      # stores, and had never been wired into any workflow. Both build their
      # archives in a temporary directory, so neither needs the database.
      - name: Test backup validation and the archive summary cache
        run: >-
          python -m unittest
          tests.test_next_backup
          tests.test_next_backup_summary_cache

      # ======================================================================
      # EVERY STEP ABOVE THIS LINE RUNS AGAINST AN EMPTY DATABASE.
      # A test that reads or writes any table belongs BELOW it, or it dies
      # on `relation "..." does not exist`. This has caught two additions
      # placed above by mistake; the comment is cheaper than the red run.
      # ======================================================================
      - name: Apply Next migrations
        run: python next_database.py migrate

      - name: Show migration status
        run: python next_database.py status

      # Below the migrations for the reason the block further down gives, and
      # for a second one specific to this pair: they do not merely read tables,
      # they assert what PostgreSQL *does* -- which index the planner picks, and
      # what the connection's transaction status is at the moment a provider is
      # called. Neither question exists without the schema. Placed above the
      # migrations first, where both died on `relation "people" does not exist`.
      - name: Test the person-identifier lookup index
        run: python -m unittest tests.test_next_person_identifier_index

      # Beside the person-identifier index for the same reason -- it asserts which
      # plan the planner picks, and whether two OFFSET pages of the library overlap,
      # neither of which is a question without the schema.
      #
      # tests.test_next_library_paging is unconditional and was, until #715, running
      # nowhere: 48 assertions written specifically to keep the library's background
      # hydration from stalling, none of them executed by any workflow. A test that
      # no job names does not exist, and this file is the only place that can name it.
      - name: Test the library paging contract and its sort index
        run: >-
          python -m unittest
          tests.test_next_library_paging
          tests.test_next_library_sort_index

      # The one test of this module that runs it rather than reading it. Every
      # source-text assertion in test_next_library_paging passed throughout #715,
      # while the library stopped at 700 of 2,509 movies -- a string cannot notice
      # a case nobody thought of. Needs node, which ubuntu-latest ships.
      - name: Replay library hydration against the real module
        run: python -m unittest tests.test_next_library_hydration_replay

      # The other half of #719: deleting a movie must take it off every
      # watchlist while watched history keeps its snapshot entries. Needs the
      # real PostgreSQL because every claim is about what the database does --
      # which rows a delete removes, what the LEFT JOIN's tombstone filter
      # hides, and what the relink writes back.
      - name: Test the watchlist deletion policy
        run: python -m unittest tests.test_next_watchlist_deletion

      # Its sibling: watch history keeps its entries when the movie goes, so
      # the address of its poster has to survive too. The one it froze was
      # `/api/next/media/assets/<id>`, which 404s the moment the movie's
      # artwork links are deleted with it -- an <img> that paints nothing and
      # reads as a deliberate black poster. Real PostgreSQL again: the whole
      # claim is about what a delete leaves behind in a jsonb snapshot.
      - name: Test that a surviving watched entry keeps a loadable poster
        run: python -m unittest tests.test_next_watch_history_poster

      # The third half of the same report: whether history survives a delete at
      # all is the user's call, not the app's. Most of what this covers is the
      # boundary of that choice -- it is read per user rather than per actor,
      # because a delete is performed by one person and lands on everybody's
      # lists, and only the owner of a history may decide whether it is
      # history. Real PostgreSQL: two users, two settings, one delete.
      - name: Test the watch-history deletion preference
        run: python -m unittest tests.test_next_watch_history_deletion_preference

      # Sorting the personal lists. Half of this module reads the source and
      # half of it runs the comparator under node, and the split is deliberate:
      # the source half pins the wiring a copy-paste from the Library gets
      # wrong -- the Library binds [data-sort-option] globally, so a Lists menu
      # reusing that attribute would silently re-sort the Library -- while the
      # node half catches what a string cannot, the way #715 got past every
      # source-text assertion in test_next_library_paging.
      - name: Test personal-list sorting
        run: python -m unittest tests.test_next_lists_sorting

      # The sort button that came out of that work drew nothing: the icon
      # sizing rule was scoped to `.collection-controls`, and the Lists
      # toolbar is not inside one. Markup identical to the Library's, blank on
      # screen -- the difference lives three levels up, where a diff cannot
      # show it. This pins the rule to the trigger's own class so a new
      # trigger works wherever it is dropped.
      - name: Test that toolbar menu triggers draw their icon
        run: python -m unittest tests.test_next_toolbar_menu_trigger_icon

      # The last of the #719 follow-ups: recording a watch takes its subject
      # off the watchlist. The half worth guarding is the scope -- the plugin
      # sync imports a watchlist and then a watch history in the same run, so
      # applying the rule there would make one operation delete what it had
      # just written. A source assertion holds that exclusion in place; the
      # rest needs real PostgreSQL, including that an actor with no id clears
      # nothing rather than everything.
      - name: Test that recording a watch clears the watchlist
        run: python -m unittest tests.test_next_watch_clears_watchlist

      # The same collection that could not delete a movie cleanly also could not
      # see past the 500th entry of its own lists. The ceiling sat in four places
      # at once -- both entity builders, the routes and the page -- so the test
      # asserts on all four and then proves, against the real database, that more
      # than 500 rows actually come back.
      - name: Test the personal-list ceiling
        run: python -m unittest tests.test_next_personal_list_paging

      - name: Test the import transaction boundary
        run: python -m unittest tests.test_next_import_transaction_boundary

      # Needs the real PostgreSQL, because the property is about what the
      # database returns across page boundaries rather than about the shape of
      # the response. The assertion that matters is the negative one: a page
      # that ends exactly on the boundary must not claim a further page, and a
      # cut list must not look like a complete one -- which is precisely how
      # this endpoint failed before.
      - name: Test the series list paging
        run: python -m unittest tests.test_next_series_paging

      # The sync contract calls the bootstrap a complete snapshot and it could
      # quietly not be one. The assertions that matter are the two negative
      # ones: a deliberately unbounded collection must not be listed as capped,
      # and the probe row fetched to answer "was this cut?" must never reach the
      # client. Both are the kind of mistake that leaves a passing endpoint
      # returning subtly wrong data.
      - name: Test bootstrap completeness reporting
        run: python -m unittest tests.test_next_bootstrap_completeness

      # The same rule one level deeper, and the one the user's own
      # pg_stat_activity sample specified: five backends idle in transaction for
      # three to five seconds, each having last run a read of a plugin's
      # configuration. That read is what reopens the transaction, so this asserts
      # from a second connection that nothing is idle in transaction at the
      # moment a provider is called -- and structurally that every call site
      # releases, because a new one is how this comes back.
      - name: Test the provider-call transaction boundary
        run: python -m unittest tests.test_next_provider_call_transaction_boundary

      # A liveness probe that deletes rows and unlinks files can outlast its own
      # timeout and get a healthy container restarted, so `/api/next/health` has
      # to stay read-only. Only a real database answers that: the assertion is
      # that a row whose retention window has expired is still there after the
      # probe ran, and gone after the purge the worker now owns. Both halves
      # matter -- a probe that stopped purging because the purge broke would
      # pass the first assertion on its own.
      - name: Test that the health probe does no write work
        run: python -m unittest tests.test_next_health_is_read_only

      # The statistics page had no coverage here at all, which is how its two
      # credit charts shipped reading empty on a full collection: the query
      # asked `job` for both, but a metadata refresh writes the crew role into
      # `credit_type` and leaves 'Director' capitalised in `job`, while a cast
      # row has no job at all. Only a real database answers which rows a
      # predicate selects, and the negative cases matter as much as the
      # positive ones - 'Director of Photography' contains the word and did
      # not direct the film, so a substring match would refill these charts
      # with the wrong people and still look fixed.
      - name: Test the statistics top-credit predicates
        run: python -m unittest tests.test_next_stats_top_credits_postgres

      # What the same charts count as one thing. A shelf holds releases, so
      # two editions of a film and a season box set are several rows, and
      # counting rows scores a director once per disc owned. The assertions
      # that matter are the negative ones - a shared title, a shared year, a
      # shared director and a blank identifier must each merge nothing - since
      # over-merging is the failure that silently deletes entries from a chart
      # while still looking like a working page.
      - name: Test the statistics work key and media filter
        run: python -m unittest tests.test_next_stats_work_dedup_postgres

      - name: Test MovieVault v2 PostgreSQL synchronization
        run: python -m unittest tests.test_next_movievault_v2_postgres

      # Below the migrations, unlike the pure-function conversions near the top:
      # these read through the real readers, so they need the tables to exist.
      # Placed above them first, where every case died on a missing relation --
      # the same trap the parser step set once before.
      - name: Test the field corrections against the readers
        run: python -m unittest tests.test_next_movievault_v2_field_corrections_postgres

      # Two more the hand-written list never named, and they cover the rules
      # migration 063 pushed into the schema rather than into code - a series
      # only on a SHOW, a season only from its own series, and now filling a
      # description without overwriting one somebody wrote. None of it was
      # running anywhere but a contributor's machine.
      - name: Test the series hierarchy and its description refresh
        run: >-
          python -m unittest
          tests.test_next_series
          tests.test_next_series_postgres

      # The Library groups by series through the dashboard snapshot rather than
      # through the sync wire, so nothing else in this list would notice if the
      # grouping regressed. The PostgreSQL half needs the real schema: whether a
      # series with no visible disc is listed is a visibility rule, not a mapping.
      - name: Test the series as a Library grouping
        run: >-
          python -m unittest
          tests.test_next_library_series_ui
          tests.test_next_library_series_postgres

      # The library's own list surface, and the order it puts rows in. The same
      # gap #715 closed for test_next_library_paging above, one module over and
      # still open: test_next_library_list_ui was named by no workflow, so the
      # comparators behind the Library's sort were never executed. That is how
      # the sort order could be wrong for as long as it was -- the server orders
      # on COALESCE(sort_title, title), the SPA hydrates the whole library and
      # re-sorts it, and a client sorting on the display title instead threw
      # that away with nothing red: every row present, in the wrong order
      # (#716).
      #
      # Not grouped with the paging step above, which needs the schema. This one
      # reads the inline script's source and wants no database at all.
      - name: Test the library list and its sort order
        run: python -m unittest tests.test_next_library_list_ui

      # The library page is one function with two SQL branches, and only the one
      # that finds entity_media/media_assets is ever exercised. A column added to
      # that branch alone is absent on the fallback, where the feature reading it
      # then does nothing at all -- no error, no empty state, just a field that is
      # never there. This is the same class of gap the two steps above closed by
      # naming their modules; it needs no database, only the source.
      - name: Test that both library preview branches select the same columns
        run: python -m unittest tests.test_next_library_preview_branch_parity

      # The film's country of origin and original language -- distinct from
      # movies.country/movies.language, which describe the disc. The PostgreSQL
      # half is the one that matters: there is no catalogue table and no foreign
      # key behind these columns, deliberately, so the CHECK constraints in
      # migration 087 are the only thing standing between the filter and a
      # country code it cannot display. A stub can assert the SQL was written
      # and learns nothing about whether the database refuses 'jp'.
      - name: Test film origin capture and storage
        run: >-
          python -m unittest
          tests.test_next_origin
          tests.test_next_origin_postgres
          tests.test_next_origin_ui
          tests.test_next_origin_backfill
          tests.test_next_origin_backfill_routes

      # The personal rating. Two of its claims fail silently rather than loudly,
      # so both are asserted against a real database: that an unrated film reads
      # as absent rather than as a zero somebody chose, and that the "is this the
      # owner" test is made server-side -- a client comparing owner_id to its own
      # id reads a NULL owner_id as "I am the owner", which is the bug shape
      # renderMovieLoan already carries a comment about.
      - name: Test the personal rating
        run: >-
          python -m unittest
          tests.test_next_movie_ratings
          tests.test_next_movie_rating_ui

      # The flags beside the content-rating age label. This whole failure is
      # silent from both ends: a flag is an <img> at /api/next/flags/<code>.svg,
      # a name with no file behind it answers 404, and the browser draws its
      # broken-image glyph while the age label keeps rendering -- so it reads as
      # a styling glitch. Eight of the twenty-three countries the picker offers
      # had no flag (#749), two of them because Denmark's and Sweden's files
      # were named by language code. Nothing but this ties the picker's list and
      # the flag directory together.
      - name: Test the content-rating flag icons
        run: python -m unittest tests.test_next_flag_icons

      # Instance-defined custom fields. The claim that needs a real database is
      # that a value lands in the column matching its declared type: that pairing
      # needs a join, so it cannot be a CHECK, and nothing but this stands behind
      # it. A number written into value_text would sort as a string and nobody
      # would see why "10" came before "9". The RESTRICT that makes "archive,
      # never delete" more than a convention is equally untestable in a stub.
      - name: Test instance-defined custom fields
        run: >-
          python -m unittest
          tests.test_next_custom_fields
          tests.test_next_custom_fields_routes
          tests.test_next_custom_fields_ui
          tests.test_next_custom_field_filters

      # The export catalogue and everything that has to stay in step with it: the
      # client-side row builder, the column label map, and the i18n key for every
      # column in all 29 locales. Adding one column touches four files plus the
      # catalogues, and tests.test_next_export is the only thing that notices when
      # one of them is missed -- it has never been named by a workflow, so it has
      # never run on a pull request. Same argument as test_next_library_paging
      # above, and the same fix.
      #
      # tests.test_next_genres rides along: it is the closest thing to a contract
      # test for a relational, TMDB-owned movie dimension, and it was equally
      # unrun. Neither needs a database.
      - name: Test the export catalogue and the genre dimension
        run: >-
          python -m unittest
          tests.test_next_export
          tests.test_next_genres

      # The series detail page. The PostgreSQL half is the one that matters: it
      # pins that series artwork really is stored with entity_type='series', a
      # value migration 003 leaves unconstrained and which therefore has nothing
      # but a test standing behind it.
      - name: Test the series detail page
        run: python -m unittest tests.test_next_series_detail_postgres

      # Giving a series the identifier that makes it enrichable at all. The
      # PostgreSQL half is the one that matters: that one identifier cannot name
      # two series, and that correcting one replaces rather than accumulates,
      # are both facts about rows.
      - name: Test series identity
        run: python -m unittest tests.test_next_series_identity

      # Layer 4. The PostgreSQL half is what matters: whether the bootstrap and
      # the delta agree about a disc's seasons is a fact about two SELECT lists,
      # and the drift they can develop is invisible until somebody reinstalls.
      - name: Test the series sync wire
        run: python -m unittest tests.test_next_series_sync_wire

      # Episodes. The two rules that matter are foreign keys rather than code --
      # an episode cannot be attached under a season it does not belong to, and a
      # season link must not imply every episode -- so only a real schema can
      # assert them.
      - name: Test series episodes
        run: python -m unittest tests.test_next_series_episodes

      # No database in this one, and it is named here for exactly that reason:
      # this list is hand-written, so a module nobody adds is a module CI never
      # runs. What it guards is the route by which a series comes into existence
      # at all -- the planner asking the television namespace, and the two
      # candidate rebuilds that each silently dropped the fields making a series
      # a series.
      - name: Test adding a series from the title search
        run: python -m unittest tests.test_next_series_add_flow

      # Named here for the same reason as the module above it. The database ids
      # a record is known by live in two different tables -- a film's in
      # `movie_identifiers`, a show's on the series -- and the edit surface has
      # to keep them apart. It also holds the guard on the merge that used to
      # blank an id the sources had found, which is a pure-function claim and
      # needs no database.
      - name: Test the database ids and where each one is stored
        run: python -m unittest tests.test_next_movie_source_ids

      # Where a hand-created series gets its seasons. The PostgreSQL half is the
      # part that matters: that the offer writes nothing, and that a season
      # already in the collection comes back marked rather than filtered out --
      # both are claims about rows, and the second is what keeps a complete
      # series from looking like an empty answer.
      - name: Test the season offer
        run: python -m unittest tests.test_next_series_seasons_available

      # The discs inside a release, for the same reason as episodes above: the
      # guarantees are foreign keys, not code. A disc cannot carry a season the
      # release does not cover, and it cannot be named under another release.
      # The identity assertions belong here too -- a disc is pointed at by its
      # episode links, so "saving twice keeps the same rows" is a claim only a
      # real database can settle.
      - name: Test the discs inside a release
        run: >-
          python -m unittest
          tests.test_next_discs
          tests.test_next_discs_postgres
          tests.test_next_discs_ui

      # The last leg of the same subject: the catalogue's breakdown filling a
      # release that has none. Below the migrations because it writes rows, and
      # its mapping half is checked against the plugin's real output rather
      # than a fixture -- the failure mode that cost a day.
      - name: Test the disc enrichment from the catalogue
        run: python -m unittest tests.test_next_disc_enrichment

      # The release row as the union of its discs, and the push-down that keeps
      # a leftover from being deleted by the derivation. Below the migrations:
      # the interesting assertions are about rows before and after a save.
      - name: Test the release row derived from the discs
        run: python -m unittest tests.test_next_disc_union

      # The one-time sweep that converges releases broken down before the
      # derivation existed. Also below the migrations, and for a sharper reason
      # than the module above: its whole subject is a release in a state the
      # ordinary write path cannot produce any more, so every interesting case
      # needs real rows written around the save path.
      - name: Test the one-time disc-union backfill
        run: python -m unittest tests.test_next_disc_union_backfill

      # `clears`, and the presence rule inside a disc entry. Below the
      # migrations because the acceptance case is a real push against real rows:
      # the last disc and the last note removed, and the derivation not putting
      # the removed value straight back.
      - name: Test the sync clears vocabulary and disc-entry presence
        run: python -m unittest tests.test_next_sync_clears

      # That an upsert never leaves its own write in a tombstoned row. Below the
      # migrations because the assertion is what the row looks like afterwards,
      # which is the one thing a fake cursor cannot answer -- the SQL issued
      # looked correct throughout the bug this covers. The write half needs real
      # rows for the same reason: the mapping route that caused it resolves
      # through `client_entity_mapping` against the database, not through the
      # ladder.
      - name: Test tombstone resurrection on a sync upsert
        run: python -m unittest tests.test_next_sync_tombstone_resurrection_postgres

      # Who changed a film. The interesting half is the half a real database
      # settles: that a synced push actually leaves an audit row behind, and
      # that the two sources -- the audit and the per-field provenance -- merge
      # into one list in one order. Without a DATABASE_URL those cases skip and
      # the module looks green while testing only the user-agent mapping.
      - name: Test the change history of a film
        run: python -m unittest tests.test_next_movie_history

      # This one has no database at all, but it guards the surface-id and route
      # registration that a new detail page has to join to be reachable.
      - name: Test the app surface router
        run: python -m unittest tests.test_next_app_surface_router

      # No database either. It guards the PWA's one shared scope: the frontend
      # is a single inline script, so two functions of one name is not an error
      # but a silent overwrite -- which is how language names stopped being
      # displayed anywhere, for months, with nothing red.
      - name: Test the inline script's scope
        run: python -m unittest tests.test_next_views_ui_scope

      # The same shape one layer down: the PWA has no global tone classes, so a
      # message container that grows a tone without the matching CSS renders it
      # as the base muted style -- identical to passing no tone at all. Nothing
      # can fail there on its own, because a missing rule is a default rather
      # than an error, which is how every `warn` on every detail page read as
      # ordinary grey text.
      - name: Test that every message tone is styled
        run: python -m unittest tests.test_next_views_message_tones

      # These three had never run in CI: the workflow lists its test modules by
      # hand and they were simply never added. That is the same class of gap as
      # the bootstrap/delta drift they exist to catch - a guard nobody invokes
      # is not a guard.
      - name: Test movie sync payload parity and the technical profile
        run: >-
          python -m unittest
          tests.test_next_movie_sync_payload_parity
          tests.test_next_technical_profile_sync
          tests.test_next_movie_estimated_value

      # Same gap, same fix. These three guard the packaging axes - the edit
      # payload, the derived flat mirror, and the PWA form that writes them -
      # and none of them was invoked here. Two of the movie-detail assertions
      # had in fact been red since migrations 067/071 replaced the flat
      # nine-value control with the axes, and nothing reported it.
      - name: Test the movie edit payload and the packaging axes
        run: >-
          python -m unittest
          tests.test_next_movies
          tests.test_next_movie_technical_specs_packaging_postgres
          tests.test_next_movie_detail_ui

      - name: Test API and MCP connection grouping
        run: python -m unittest tests.test_next_api_connections

      # Same hand-listed gap as the modules above: the container policy tests
      # had never been added here, and the reorder module guards the member
      # routes against requiring links the client was never shown (a container
      # holding a tombstoned movie was permanently un-reorderable).
      - name: Test container member routes and reordering
        run: >-
          python -m unittest
          tests.test_next_containers
          tests.test_next_container_reorder

      # The bulk membership routes the library's Select mode posts to. They had
      # no route-level test at all, which is how #720 shipped: adding a
      # selection to a box-set raised `NameError` on the collection-value
      # snapshot, and the collection half is here so the list route is covered
      # by the same reflex.
      - name: Test the bulk box-set and list membership routes
        run: python -m unittest tests.test_next_bulk_container_movies

      # The import preview's box-set branch, which only runs when a provider
      # actually answers with a proposal -- so nothing reached the line that
      # hashed each proposal's identity, and it named a module that does not
      # exist under that name.
      - name: Test import box-set proposal suggestions
        run: python -m unittest tests.test_next_import_box_set_proposal_suggestions

      # A MovieVault poster is served by its own route; the generic media route
      # refuses it. This pins that every reader of a box-set's linked cover
      # builds the URL that will actually serve it.
      - name: Test the poster URL a linked MovieVault cover resolves to
        run: python -m unittest tests.test_next_container_poster_url

      # Two cuts of one film share an IMDb id, so a box set holding both lost a
      # member to the dedupe. This guards that a collision only collapses two
      # members when nothing distinguishes them.
      - name: Test box-set member deduplication
        run: python -m unittest tests.test_next_box_set_member_dedupe

      # An imported box-set member is identified by the MovieVault release the
      # proposal names and by nothing else -- it has no year and its barcode is
      # synthetic. Dropping that id left every member unrefreshable while the
      # refresh still reported success.
      - name: Test box-set member identity survives the import
        run: python -m unittest tests.test_next_box_set_member_identity

      # A vault and a collection showed a cover on their page and an empty tile
      # in the library. This guards that every container surface resolves the
      # cover through the one shared chain.
      - name: Test the container tile's poster resolution
        run: python -m unittest tests.test_next_container_tile_poster

      # The user's own photographs of a release, a box set or a series. These
      # are the only images in the app that no source can supply a second time,
      # and the rules that keep them are all about two devices touching one set:
      # the union that must survive an upload from either side, the last writer
      # who settles which one is representative, and the re-upload of a deleted
      # image that must revive it rather than silently do nothing. None of that
      # is checkable against a fake cursor, so the postgres half is the half
      # that matters here.
      - name: Test the user's own images
        run: >-
          python -m unittest
          tests.test_next_own_images
          tests.test_next_own_images_postgres

      - name: Create minimal legacy SQLite fixture
        run: |
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          fixture_dir = Path(os.environ["RUNNER_TEMP"]) / "discvault-import-fixture"
          fixture_dir.mkdir(parents=True, exist_ok=True)
          db_path = fixture_dir / "discvault.db"
          conn = sqlite3.connect(db_path)
          conn.execute("CREATE TABLE settings (key TEXT PRIMARY KEY, value TEXT)")
          conn.execute(
              "INSERT INTO settings (key, value) VALUES (?, ?)",
              ("tmdb_enabled", "true"),
          )
          conn.commit()
          conn.close()
          print(db_path)
          PY

      - name: Dry-run legacy import fixture
        run: python next_import.py --db "$RUNNER_TEMP/discvault-import-fixture/discvault.db" --data-dir "$RUNNER_TEMP/discvault-import-fixture" --dry-run

      - name: Import legacy fixture
        run: python next_import.py --db "$RUNNER_TEMP/discvault-import-fixture/discvault.db" --data-dir "$RUNNER_TEMP/discvault-import-fixture" --skip-media

      - name: Smoke Next API endpoints
        run: |
          python - <<'PY'
          from next_app import app

          client = app.test_client()
          for path in (
              "/api/next/health",
              "/api/next/stats",
              "/api/next/settings",
              "/api/next/digital-sources",
              "/api/next/digital-items",
              "/api/next/plugins/registry",
              "/api/next/metadata/plugins",
              "/api/next/movies",
              "/api/next/containers",
              # The library's own payload. It was never smoked, so a SQL error
              # in the snapshot broke the whole library page with nothing red --
              # and the container queries behind it are the ones that grew a
              # borrowed-cover join.
              "/api/next/app/snapshot",
              "/api/next/sync/state",
              "/api/next/sync/bootstrap",
              "/api/next/sync/delta?since=0",
              "/api/next/jobs",
          ):
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code, response.data[:500])
              payload = response.get_json()
              assert payload["status"] == "ok", (path, payload)
              print(path, payload["status"])

          app_shell = client.get("/api/next/app")
          assert app_shell.status_code == 200, app_shell.data[:500]
          app_html = app_shell.get_data(as_text=True)
          for marker in (
              "id=\"adminView\"",
              "data-app-admin-tab=\"roles\"",
              "id=\"appAdminRolesList\"",
              "id=\"appAdminPluginsList\"",
              "data-app-admin-rbac-mode=\"advanced\"",
          ):
              assert marker in app_html, marker
          print("/api/next/app", "admin-ui-ok")

          mutation = {
              "clientId": "ci-pwa-install",
              "baseRevision": 0,
              "mutations": [
                  {
                      "clientMutationId": "ci-movie-1",
                      "entityType": "movie",
                      "operation": "upsert",
                      "clientEntityId": "local-movie-1",
                      "payload": {
                          "title": "Offline Test Movie",
                          "year": "2026",
                          "format": "4K UHD"
                      }
                  }
              ]
          }
          first = client.post("/api/next/sync/mutations", json=mutation)
          assert first.status_code == 200, first.data[:500]
          first_payload = first.get_json()
          assert first_payload["results"][0]["status"] == "applied", first_payload

          replay = client.post("/api/next/sync/mutations", json=mutation)
          assert replay.status_code == 200, replay.data[:500]
          replay_payload = replay.get_json()
          assert replay_payload["results"][0]["replayed"] is True, replay_payload

          delta = client.get("/api/next/sync/delta?since=0")
          delta_payload = delta.get_json()
          assert delta_payload["changes"], delta_payload
          print("/api/next/sync/mutations", "ok")

          job_response = client.post(
              "/api/next/jobs",
              json={
                  "jobType": "sync.noop",
                  "payload": {"message": "CI worker smoke"}
              },
          )
          assert job_response.status_code == 201, job_response.data[:500]
          job_payload = job_response.get_json()
          assert job_payload["job"]["status"] == "pending", job_payload
          print("/api/next/jobs", "created", job_payload["job"]["id"])
          PY

      - name: Run Next worker once
        run: python next_worker.py run-once --worker-id ci-worker

      - name: Verify worker completed job
        run: |
          python - <<'PY'
          from next_app import app

          client = app.test_client()
          response = client.get("/api/next/jobs?status=completed")
          assert response.status_code == 200, response.data[:500]
          payload = response.get_json()
          assert payload["jobs"], payload
          assert payload["jobs"][0]["jobType"] == "sync.noop", payload
          assert payload["jobs"][0]["result"]["workerId"] == "ci-worker", payload
          print("/api/next/jobs?status=completed", "ok")
          PY

      - name: Smoke passkey session cookie auth
        run: |
          python - <<'PY'
          from uuid import uuid4

          from psycopg.types.json import Jsonb

          from next_app import app, connect
          from next_auth import SESSION_COOKIE_NAME, _create_token

          user_id = uuid4()
          with connect() as conn:
              with conn.transaction():
                  with conn.cursor() as cur:
                      cur.execute(
                          """
                          INSERT INTO users (id, username, display_name, status)
                          VALUES (%s, 'ci-cookie-owner', 'CI Cookie Owner', 'active')
                          """,
                          (user_id,),
                      )
                      cur.execute(
                          """
                          INSERT INTO user_roles (user_id, role_id, scope_type, scope_id)
                          SELECT %s, id, 'global', ''
                          FROM roles
                          WHERE key='owner'
                          """,
                          (user_id,),
                      )
                      cur.execute(
                          """
                          INSERT INTO passkey_credentials (
                              id,
                              user_id,
                              public_key,
                              sign_count,
                              credential_name,
                              transports
                          )
                          VALUES ('ci-cookie-passkey', %s, %s, 0, 'CI cookie passkey', %s)
                          """,
                          (user_id, b"fake-public-key", Jsonb([])),
                      )
                      cur.execute(
                          """
                          INSERT INTO app_settings (key, value, is_secret)
                          VALUES ('auth_enabled', 'true'::jsonb, false)
                          ON CONFLICT (key) DO UPDATE SET value=EXCLUDED.value
                          """
                      )

          client = app.test_client()
          token = _create_token(str(user_id), "ci-cookie-owner")
          client.set_cookie(SESSION_COOKIE_NAME, token)
          response = client.get("/api/next/plugins/registry")
          assert response.status_code == 200, response.data[:500]
          payload = response.get_json()
          assert payload["status"] == "ok", payload
          assert any(plugin["id"] == "movievault_v2" for plugin in payload["plugins"]), payload
          assert not any(
              plugin["id"] in {"movievault_26", "movievault"} for plugin in payload["plugins"]
          ), payload
          print("/api/next/plugins/registry", "session-cookie-ok")

          update = client.patch("/api/next/plugins/plex", json={"enabled": True, "orderIndex": 105})
          assert update.status_code == 200, update.data[:500]
          update_payload = update.get_json()
          plex = update_payload["plugin"]
          assert plex["id"] == "plex", update_payload
          assert plex["enabled"] is True, update_payload
          assert plex["orderIndex"] == 105, update_payload
          print("/api/next/plugins/plex", "admin-update-ok")

          config = client.patch(
              "/api/next/plugins/plex/config",
              json={
                  "settings": {"baseUrl": "https://plex.example"},
                  "secrets": {"token": "ci-secret-token"},
              },
          )
          assert config.status_code == 200, config.data[:500]
          config_payload = config.get_json()
          assert config_payload["config"]["settings"]["baseUrl"] == "https://plex.example", config_payload
          assert config_payload["config"]["secretsConfigured"] is True, config_payload
          assert "token" in config_payload["config"]["secretNames"], config_payload
          assert "ci-secret-token" not in config.get_data(as_text=True), config_payload
          print("/api/next/plugins/plex/config", "admin-config-ok")

          health = client.get("/api/next/plugins/plex/health")
          assert health.status_code == 200, health.data[:500]
          health_payload = health.get_json()
          assert health_payload["health"]["state"] in {"available", "configured"}, health_payload
          print("/api/next/plugins/plex/health", "admin-health-ok")

          execute = client.post(
              "/api/next/plugins/plex/execute",
              json={"entrypoint": "discover_library", "payload": {"dryRun": True}},
          )
          assert execute.status_code == 200, execute.data[:500]
          execute_payload = execute.get_json()
          assert execute_payload["execution"]["status"] == "ok", execute_payload
          assert execute_payload["execution"]["result"]["connector"] == "plex", execute_payload
          print("/api/next/plugins/plex/execute", "admin-execute-ok")

          queued = client.post(
              "/api/next/plugins/plex/jobs",
              json={"entrypoint": "sync_library", "payload": {"dryRun": True}},
          )
          assert queued.status_code == 201, queued.data[:500]
          queued_payload = queued.get_json()
          assert queued_payload["job"]["jobType"] == "plugin.execute", queued_payload
          assert "ci-secret-token" not in queued.get_data(as_text=True), queued_payload
          print("/api/next/plugins/plex/jobs", "admin-queue-ok")

          from next_worker import run_once

          assert run_once("ci-worker") == 0
          digital_sources = client.get("/api/next/digital-sources")
          assert digital_sources.status_code == 200, digital_sources.data[:500]
          digital_payload = digital_sources.get_json()
          plex_source = next((item for item in digital_payload["items"] if item["plugin_id"] == "plex"), None)
          assert plex_source is not None, digital_payload
          assert plex_source["last_status"] == "configured", digital_payload
          print("/api/next/digital-sources", "worker-persistence-ok")

          with connect() as conn:
              with conn.transaction():
                  with conn.cursor() as cur:
                      cur.execute(
                          """
                          INSERT INTO movies (public_id, title, sort_title, year, metadata)
                          VALUES ('ci-digital-duplicate-movie', 'CI Digital Duplicate', 'CI Digital Duplicate', '2026', '{}'::jsonb)
                          ON CONFLICT (public_id) DO UPDATE SET title=EXCLUDED.title
                          RETURNING id
                          """
                      )
                      duplicate_movie_id = cur.fetchone()["id"]
                      cur.execute("SELECT id FROM digital_media_sources WHERE plugin_id='plex'")
                      source_id = cur.fetchone()["id"]
                      cur.execute("DELETE FROM digital_media_items WHERE source_id=%s", (source_id,))
                      for index in (1, 2):
                          cur.execute(
                              """
                              INSERT INTO digital_media_items (
                                  source_id,
                                  external_id,
                                  media_type,
                                  title,
                                  year,
                                  playback_url,
                                  matched_movie_id,
                                  metadata
                              )
                              VALUES (%s, %s, 'movie', 'CI Digital Duplicate', '2026', %s, %s, '{}'::jsonb)
                              """,
                              (
                                  source_id,
                                  f"ci-digital-duplicate-{index}",
                                  f"https://jellyfin.example/web/index.html#!/details?id=duplicate-{index}",
                                  duplicate_movie_id,
                              ),
                          )
          duplicate_detail = client.get(f"/api/next/movies/{duplicate_movie_id}")
          assert duplicate_detail.status_code == 200, duplicate_detail.data[:500]
          duplicate_payload = duplicate_detail.get_json()
          digital_items = duplicate_payload["detail"]["digitalItems"]
          assert len(digital_items) == 1, duplicate_payload
          assert digital_items[0]["variant_count"] == 2, duplicate_payload
          duplicate_movies = client.get("/api/next/movies?q=CI%20Digital%20Duplicate&limit=1")
          assert duplicate_movies.status_code == 200, duplicate_movies.data[:500]
          assert duplicate_movies.get_json()["items"][0]["digital_count"] == 1, duplicate_movies.get_json()
          print("/api/next/movies/<id>", "digital-dedupe-ok")

          rbac = client.get("/api/next/auth/rbac")
          assert rbac.status_code == 200, rbac.data[:500]
          rbac_payload = rbac.get_json()
          assert rbac_payload["mode"] == "basic", rbac_payload
          assert any(role["key"] == "media_viewer" for role in rbac_payload["assignableRoles"]), rbac_payload
          assert any(permission["key"] == "roles.manage" for permission in rbac_payload["permissions"]), rbac_payload
          print("/api/next/auth/rbac", "basic-ok")

          mode = client.patch("/api/next/auth/rbac", json={"mode": "advanced"})
          assert mode.status_code == 200, mode.data[:500]
          mode_payload = mode.get_json()
          assert mode_payload["mode"] == "advanced", mode_payload
          print("/api/next/auth/rbac", "advanced-ok")

          custom = client.post(
              "/api/next/auth/roles",
              json={
                  "key": "ci_curator",
                  "name": "CI Curator",
                  "description": "CI custom role",
                  "permissions": ["collection.view", "metadata.search"],
              },
          )
          assert custom.status_code == 201, custom.data[:500]
          custom_payload = custom.get_json()
          assert custom_payload["role"]["key"] == "ci_curator", custom_payload
          assert custom_payload["role"]["system"] is False, custom_payload
          assert custom_payload["role"]["permissions"] == ["collection.view", "metadata.search"], custom_payload
          print("/api/next/auth/roles", "custom-create-ok")

          patched_role = client.patch(
              "/api/next/auth/roles/ci_curator",
              json={"permissions": ["collection.view", "metadata.search", "watchlist.manage"]},
          )
          assert patched_role.status_code == 200, patched_role.data[:500]
          patched_payload = patched_role.get_json()
          assert "watchlist.manage" in patched_payload["role"]["permissions"], patched_payload
          print("/api/next/auth/roles/ci_curator", "custom-patch-ok")

          second_user_id = uuid4()
          with connect() as conn:
              with conn.transaction():
                  with conn.cursor() as cur:
                      cur.execute(
                          """
                          INSERT INTO users (id, username, display_name, status)
                          VALUES (%s, 'ci-rbac-user', 'CI RBAC User', 'active')
                          """,
                          (second_user_id,),
                      )
          assigned = client.patch(f"/api/next/auth/users/{second_user_id}/role", json={"role": "ci_curator"})
          assert assigned.status_code == 200, assigned.data[:500]
          assert assigned.get_json()["user"]["role"] == "ci_curator", assigned.get_json()
          print("/api/next/auth/users/<id>/role", "custom-assign-ok")

          multi = client.patch(
              f"/api/next/auth/users/{second_user_id}/roles",
              json={"roles": ["ci_curator", "media_viewer"]},
          )
          assert multi.status_code == 200, multi.data[:500]
          multi_roles = {role["key"] for role in multi.get_json()["user"]["roles"]}
          assert {"ci_curator", "media_viewer"}.issubset(multi_roles), multi.get_json()
          print("/api/next/auth/users/<id>/roles", "multi-assign-ok")

          reassigned = client.patch(f"/api/next/auth/users/{second_user_id}/role", json={"role": "media_viewer"})
          assert reassigned.status_code == 200, reassigned.data[:500]
          deleted = client.delete("/api/next/auth/roles/ci_curator")
          assert deleted.status_code == 200, deleted.data[:500]
          print("/api/next/auth/roles/ci_curator", "custom-delete-ok")
          PY
