name: DiscVault Next PostgreSQL Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - codex/discvault-next
    paths:
      - ".github/workflows/next-postgres-smoke.yml"
      - "app/backend/next_database.py"
      - "app/backend/next_import.py"
      - "app/backend/next_app.py"
      - "app/backend/next_plugin_runtime.py"
      - "app/backend/next_plugins/**"
      - "app/backend/next_worker.py"
      - "app/backend/migrations_next/**"
      - "app/backend/requirements.txt"

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: discvault_next
          POSTGRES_USER: discvault_next
          POSTGRES_PASSWORD: discvault_next_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U discvault_next -d discvault_next"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://discvault_next:discvault_next_dev@localhost:5432/discvault_next

    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend requirements
        run: python -m pip install -r requirements.txt

      - name: Compile Next tooling
        run: python -m py_compile next_database.py next_import.py next_app.py next_plugin_runtime.py next_worker.py

      - name: Apply Next migrations
        run: python next_database.py migrate

      - name: Show migration status
        run: python next_database.py status

      - name: Create minimal legacy SQLite fixture
        run: |
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          fixture_dir = Path(os.environ["RUNNER_TEMP"]) / "discvault-import-fixture"
          fixture_dir.mkdir(parents=True, exist_ok=True)
          db_path = fixture_dir / "discvault.db"
          conn = sqlite3.connect(db_path)
          conn.execute("CREATE TABLE settings (key TEXT PRIMARY KEY, value TEXT)")
          conn.execute(
              "INSERT INTO settings (key, value) VALUES (?, ?)",
              ("tmdb_enabled", "true"),
          )
          conn.commit()
          conn.close()
          print(db_path)
          PY

      - name: Dry-run legacy import fixture
        run: python next_import.py --db "$RUNNER_TEMP/discvault-import-fixture/discvault.db" --data-dir "$RUNNER_TEMP/discvault-import-fixture" --dry-run

      - name: Import legacy fixture
        run: python next_import.py --db "$RUNNER_TEMP/discvault-import-fixture/discvault.db" --data-dir "$RUNNER_TEMP/discvault-import-fixture" --skip-media

      - name: Smoke Next API endpoints
        run: |
          python - <<'PY'
          from next_app import app

          client = app.test_client()
          for path in (
              "/api/next/health",
              "/api/next/stats",
              "/api/next/settings",
              "/api/next/plugins/registry",
              "/api/next/metadata/plugins",
              "/api/next/movies",
              "/api/next/containers",
              "/api/next/sync/state",
              "/api/next/sync/bootstrap",
              "/api/next/sync/delta?since=0",
              "/api/next/jobs",
          ):
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code, response.data[:500])
              payload = response.get_json()
              assert payload["status"] == "ok", (path, payload)
              print(path, payload["status"])

          mutation = {
              "clientId": "ci-pwa-install",
              "baseRevision": 0,
              "mutations": [
                  {
                      "clientMutationId": "ci-movie-1",
                      "entityType": "movie",
                      "operation": "upsert",
                      "clientEntityId": "local-movie-1",
                      "payload": {
                          "title": "Offline Test Movie",
                          "year": "2026",
                          "format": "4K UHD"
                      }
                  }
              ]
          }
          first = client.post("/api/next/sync/mutations", json=mutation)
          assert first.status_code == 200, first.data[:500]
          first_payload = first.get_json()
          assert first_payload["results"][0]["status"] == "applied", first_payload

          replay = client.post("/api/next/sync/mutations", json=mutation)
          assert replay.status_code == 200, replay.data[:500]
          replay_payload = replay.get_json()
          assert replay_payload["results"][0]["replayed"] is True, replay_payload

          delta = client.get("/api/next/sync/delta?since=0")
          delta_payload = delta.get_json()
          assert delta_payload["changes"], delta_payload
          print("/api/next/sync/mutations", "ok")

          job_response = client.post(
              "/api/next/jobs",
              json={
                  "jobType": "sync.noop",
                  "payload": {"message": "CI worker smoke"}
              },
          )
          assert job_response.status_code == 201, job_response.data[:500]
          job_payload = job_response.get_json()
          assert job_payload["job"]["status"] == "pending", job_payload
          print("/api/next/jobs", "created", job_payload["job"]["id"])
          PY

      - name: Run Next worker once
        run: python next_worker.py run-once --worker-id ci-worker

      - name: Verify worker completed job
        run: |
          python - <<'PY'
          from next_app import app

          client = app.test_client()
          response = client.get("/api/next/jobs?status=completed")
          assert response.status_code == 200, response.data[:500]
          payload = response.get_json()
          assert payload["jobs"], payload
          assert payload["jobs"][0]["jobType"] == "sync.noop", payload
          assert payload["jobs"][0]["result"]["workerId"] == "ci-worker", payload
          print("/api/next/jobs?status=completed", "ok")
          PY
