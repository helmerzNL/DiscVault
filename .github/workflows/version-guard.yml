name: DiscVault Version Guard

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/v26-beta
  pull_request:

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (git fallback, no action download)
        env:
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*"
          git fetch --no-tags origin "${GH_SHA}"
          git checkout --force FETCH_HEAD

      - name: Reject forbidden iOS artifacts
        run: python app/scripts/check_forbidden_paths.py --tree HEAD

      # A pull request no longer bumps app/VERSION -- the beta push workflow does that
      # after the merge. So the question here is inverted: a PR must leave the file
      # alone. A hand-written bump would go stale the moment another PR lands ahead of
      # it, which is the collision this whole arrangement removes (#473/#474,
      # #516/#517, and the three-way collision repaired by #573).
      #
      # A promotion into main is the exception, and it has to be spelled out here: that
      # pull request exists precisely to carry beta's CI-applied bumps to production, so
      # its diff always contains app/VERSION. Without the base-ref condition this step
      # refused every promotion PR -- the rule meant for PRs *into beta* was applied to
      # the one PR shape that must change the file.
      - name: Refuse a hand-written version bump
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main'
        run: |
          python app/scripts/check_version_bumped.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --base-ref "${{ github.event.pull_request.base.ref }}" \
            --forbid-change

      # Plugins run from a writable install directory that is seeded once, and an
      # installed copy is replaced only when the bundled manifest version is strictly
      # newer. So a bundled plugin edited without a version bump reaches new installs
      # and no existing one, silently. `movievault_v2` shipped orderIndex 45, was
      # changed to 5, and kept version 1.8.0 - every upgraded instance kept 45 on disk,
      # and it only looked right because the accompanying migration wrote the database
      # row directly. No test can catch this: every test run starts without an install
      # directory, so the one environment where the bug exists is the one never tested.
      # The diff is where the evidence is, which is why the check lives here.
      #
      # Promotions excluded for the same reason as the bump rule above: a promotion
      # carries beta's already-checked commits, and re-checking the aggregate range
      # would demand a second bump for a change that already had one.
      - name: Check bundled plugin changes carry a version bump
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main'
        run: |
          python app/scripts/check_plugin_manifest_versions.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

      # The promotion's own check: not "was the file left alone" but "does it move
      # production forward". --aggregate compares the whole range, so it also catches a
      # promotion that somehow carries protected-path changes without a newer version.
      # --base-ref resolves the live main tip rather than the sha recorded when the PR
      # was opened, which is what keeps this honest if main moves while it is open.
      - name: Check the promotion carries a newer version
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        run: |
          python app/scripts/check_version_bumped.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --base-ref "${{ github.event.pull_request.base.ref }}" \
            --aggregate

      # On main the bump is not CI's to make: main only ever receives promotion merges,
      # which carry beta's bump commits with them. So the original progression check
      # stands there, and a promotion that somehow lost the bump still fails.
      - name: Check app version bump
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/release/v26-beta'
        run: |
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            python app/scripts/check_version_bumped.py --base "${{ github.event.before }}" --head "${{ github.sha }}" --aggregate
          else
            python app/scripts/check_version_bumped.py --base HEAD~1 --head HEAD
          fi
