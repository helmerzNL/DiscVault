name: DiscVault Version Guard

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/v26-beta
  pull_request:

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (git fallback, no action download)
        env:
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*"
          git fetch --no-tags origin "${GH_SHA}"
          git checkout --force FETCH_HEAD

      - name: Reject forbidden iOS artifacts
        run: python app/scripts/check_forbidden_paths.py --tree HEAD

      - name: Check app version bump
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python app/scripts/check_version_bumped.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --base-ref "${{ github.event.pull_request.base.ref }}" --aggregate
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            python app/scripts/check_version_bumped.py --base "${{ github.event.before }}" --head "${{ github.sha }}" --aggregate
          else
            python app/scripts/check_version_bumped.py --base HEAD~1 --head HEAD
          fi
