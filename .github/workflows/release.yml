name: Release (tag main)

# Cut a production release from main. Reads app/VERSION as the single source of
# truth, requires reviewed notes at docs/releases/v<VERSION>.md, creates the
# matching `v<VERSION>` git tag on the current main commit and publishes a GitHub
# Release. The tag push then triggers docker-publish.yml, which builds the release
# snapshot (:v26.x.x, :v26, :stable) from that exact commit.
#
# Run this manually from the GitHub UI (Actions -> Release (tag main) -> Run
# workflow) with the branch set to `main`, after a beta -> main promotion has
# landed and version-guard has bumped app/VERSION.

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Needed to dispatch docker-publish.yml for the release snapshot; see the
  # "Publish the version-pinned image" step for why a dispatch is required.
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Guard branch is main
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::This workflow must be run from 'main' (got '${GITHUB_REF_NAME}')."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Read app/VERSION
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < app/VERSION)"
          if [[ -z "${VERSION}" ]]; then
            echo "::error::app/VERSION is empty."
            exit 1
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::app/VERSION '${VERSION}' is not a MAJOR.MINOR.PATCH semver."
            exit 1
          fi
          TAG="v${VERSION}"
          NOTES_FILE="docs/releases/${TAG}.md"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} from $(git rev-parse HEAD)"

      - name: Guard version-specific release notes exist
        env:
          NOTES_FILE: ${{ steps.version.outputs.notes_file }}
        run: |
          if [[ ! -f "${NOTES_FILE}" ]]; then
            echo "::error file=${NOTES_FILE}::Required release notes file ${NOTES_FILE} is missing. Review and commit ${NOTES_FILE} before running this workflow."
            exit 1
          fi

      - name: Guard tag does not already exist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists. Bump app/VERSION on main before releasing."
            exit 1
          fi

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_FILE: ${{ steps.version.outputs.notes_file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "DiscVault ${TAG}"
          git push origin "${TAG}"
          gh release create "${TAG}" \
            --target main \
            --title "DiscVault ${TAG}" \
            --notes-file "${NOTES_FILE}" \
            --latest

      # The tag push above does NOT start docker-publish.yml, even though that workflow
      # lists `tags: v26.*.*` as a trigger. A push made with GITHUB_TOKEN deliberately
      # creates no workflow run -- the same property docker-publish.yml relies on to stop
      # its own bump commit from looping. Here it is not wanted: it means no release ever
      # cut by this workflow produced a version-pinned image. v26.9.2, v26.9.20 and
      # v26.9.41 all have :stable/:latest/:v26 from the push to main and no :v26.x.x
      # snapshot at all, so nothing can be pinned back to a specific release.
      #
      # workflow_dispatch is the documented exception to that rule: a dispatch made with
      # GITHUB_TOKEN *does* start a run. Dispatching on the tag itself is what makes the
      # build a release snapshot -- docker-publish.yml keys its tags off github.ref_type
      # and github.ref_name, so the tag ref is what tells it to publish :v26.x.x rather
      # than a throwaway :dev image.
      - name: Publish the version-pinned image for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run docker-publish.yml --ref "${TAG}"
          echo "Dispatched docker-publish.yml on ${TAG}; it publishes ${TAG}, :v26 and :stable."
