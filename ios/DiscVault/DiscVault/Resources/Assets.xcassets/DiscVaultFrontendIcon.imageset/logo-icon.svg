<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="50%" stop-color="#e8c547"/>
      <stop offset="100%" stop-color="#c9a530"/>
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6af7"/>
      <stop offset="100%" stop-color="#5548c8"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="96" fill="url(#shineGrad)" opacity="0.3"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.35"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.2"/>
  <circle cx="256" cy="256" r="130" fill="#1a1a26" stroke="url(#discGrad)" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="115" fill="none" stroke="#7c6af7" stroke-width="0.5" opacity="0.25"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#7c6af7" stroke-width="0.5" opacity="0.2"/>
  <circle cx="256" cy="256" r="85" fill="none" stroke="#7c6af7" stroke-width="0.5" opacity="0.25"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#7c6af7" stroke-width="0.5" opacity="0.2"/>
  <path d="M 160 186 A 130 130 0 0 1 290 146" fill="none" stroke="#e8c547" stroke-width="1" opacity="0.2"/>
  <path d="M 170 336 A 130 130 0 0 1 350 276" fill="none" stroke="#7c6af7" stroke-width="1.5" opacity="0.15"/>
  <path d="M 200 356 A 110 110 0 0 1 370 236" fill="none" stroke="#40c080" stroke-width="1" opacity="0.1"/>
  <circle cx="256" cy="256" r="42" fill="#12121a" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="256" cy="256" r="16" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>
  <path d="M 256 240 L 268 250 L 264 266 L 248 266 L 244 250 Z" fill="url(#goldGrad)" filter="url(#softglow)"/>
  <rect x="252" y="261" width="8" height="12" rx="2" fill="url(#goldGrad)"/>
